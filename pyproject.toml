[project]
name = "gwcs"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "torch-geometric==2.8.0",
]

[project.optional-dependencies]
gpu = [
    "torch==2.12.1",
    "torchvision==0.27.1",
]
cpu = [
    "torch==2.12.1",
    "torchvision==0.27.1",
]

[tool.uv]
environments = [
    "sys_platform == 'linux'",
]
conflicts = [
    [ { extra = "cpu" }, { extra = "gpu" } ],
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-cu130", extra = "gpu" },
]
torchvision = [
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-cu130", extra = "gpu" },
]
