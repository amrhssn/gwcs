[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gwcs"
version = "0.1.0"
description = "Multilevel Graph Wavelet Compressed Sensing with Scale-Aware Neural Recovery"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "h5py>=3.12.1",
    "huggingface-hub>=1.24.0",
    "matplotlib>=3.11.0",
    "networkx>=3.6.1",
    "pytest>=9.1.1",
    "scipy>=1.18.0",
    "torch-geometric==2.8.0",
]

[project.optional-dependencies]
gpu = [
    "torch==2.12.1",
    "torchvision==0.27.1",
]
cpu = [
    "torch==2.12.1",
    "torchvision==0.27.1",
]

[tool.hatch.build.targets.wheel]
packages = [
    "src/configs",
    "src/data",
    "src/eval",
    "src/model",
    "src/steps",
    "src/tracker.py",
    "src/transform",
    "src/visualization.py",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
filterwarnings = [
    "ignore:`torch.jit.script` is deprecated:DeprecationWarning:torch.jit._script",
    "ignore:Sparse CSR tensor support is in beta state:UserWarning",
]

[tool.uv]
environments = [
    "sys_platform == 'linux'",
    "sys_platform == 'darwin'",
    "sys_platform == 'win32'",
]
conflicts = [
    [ { extra = "cpu" }, { extra = "gpu" } ],
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

# PyTorch does not publish macOS builds to the pytorch-cpu/cu130 indexes, so
# macOS falls back to the default PyPI index for torch/torchvision instead.
[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", extra = "cpu", marker = "sys_platform != 'darwin'" },
    { index = "pytorch-cu130", extra = "gpu", marker = "sys_platform != 'darwin'" },
]
torchvision = [
    { index = "pytorch-cpu", extra = "cpu", marker = "sys_platform != 'darwin'" },
    { index = "pytorch-cu130", extra = "gpu", marker = "sys_platform != 'darwin'" },
]
